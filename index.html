<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlexFlow Production Floor</title>
  <style>
    :root {
      --bg: #071521;
      --bg-2: #0d1d2d;
      --panel: rgba(14, 27, 40, 0.92);
      --panel-2: rgba(18, 35, 53, 0.78);
      --card: rgba(18, 48, 67, 0.9);
      --line: rgba(132, 188, 255, 0.25);
      --line-strong: rgba(92, 194, 255, 0.6);
      --text: #edf7ff;
      --muted: #9bc2dd;
      --cyan: #45d1ff;
      --blue: #4a8dff;
      --green: #4ae5a5;
      --amber: #ffbf47;
      --red: #ff6f7a;
      --purple: #b88cff;
      --shadow: 0 18px 40px rgba(2, 11, 20, 0.5);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top, rgba(64, 138, 255, 0.22), transparent 30%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
    }

    body {
      padding: 24px;
    }

    .app {
      max-width: 1500px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(7, 21, 33, 0.72);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 8px 0;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--cyan);
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2vw, 2.8rem);
      letter-spacing: 0.02em;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .inline-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .inline-control input {
      width: 70px;
      border: 0;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      padding: 6px 8px;
      font-size: 0.8rem;
      font-weight: 700;
      text-align: center;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .primary { background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #03131d; }
    .secondary { background: rgba(255,255,255,0.06); border: 1px solid var(--line); color: var(--text); }
    .ghost { background: rgba(255, 191, 71, 0.12); color: #ffd37d; border: 1px solid rgba(255, 191, 71, 0.32); }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .board-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .kpi,
    .summary-box {
      background: rgba(10, 22, 32, 0.78);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 16px 18px;
    }

    .kpi .label,
    .summary-label {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .kpi .value,
    .summary-value {
      font-size: clamp(1.5rem, 2vw, 2.3rem);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .summary-box {
      background: linear-gradient(135deg, rgba(69, 209, 255, 0.12), rgba(74, 141, 255, 0.08));
      border-color: rgba(69, 209, 255, 0.38);
    }

    .summary-value {
      display: block;
      font-size: clamp(1.8rem, 2vw, 2.6rem);
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .panel {
      background: rgba(10, 22, 32, 0.8);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.012);
    }

    .panel-title {
      margin: 0;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .panel-body {
      padding: 16px 18px 18px;
    }

    .global-config { margin-bottom: 14px; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    .station-controls {
      display: grid;
      gap: 12px;
    }

    .station-config-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(11, 30, 42, 0.8);
      padding: 12px 12px 8px;
    }

    .station-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .station-head strong {
      font-size: 1rem;
    }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.15);
      opacity: 0.9;
    }

    .tag.process { background: rgba(74,141,255,0.18); color: #a9d2ff; }
    .tag.inspection { background: rgba(255,191,71,0.18); color: #ffd98b; }
    .tag.repair { background: rgba(255,111,122,0.18); color: #ffb7bf; }
    .tag.output { background: rgba(74,229,165,0.18); color: #a9f5d2; }

    .field.small {
      margin-bottom: 8px;
    }

    .board {
      position: relative;
      min-height: 540px;
      overflow: hidden;
    }

    .board-inner {
      position: relative;
      padding: 12px;
      height: 100%;
      min-height: 540px;
    }

    .floor {
      position: relative;
      height: 440px;
      background:
        linear-gradient(rgba(86, 158, 255, 0.06), rgba(86,158,255,0.06)),
        linear-gradient(180deg, rgba(8,17,24,0.9), rgba(11,31,46,0.9));
      border-radius: 16px;
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(69, 209, 255, 0.08);
    }

    .floor::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(69, 209, 255, 0.08) 25%, transparent 50%, rgba(69, 209, 255, 0.08) 75%, transparent 100%);
      transform: translateX(-100%);
      animation: flowSweep 7s linear infinite;
      pointer-events: none;
    }

    .floor-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
    }

    .station-row {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 28px;
      display: grid;
      grid-template-columns: repeat(7, minmax(120px, 1fr));
      gap: 12px;
      align-items: stretch;
    }

    .station {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 170px;
      border-radius: 16px;
      border: 1px solid var(--line-strong);
      background: linear-gradient(180deg, rgba(18, 45, 66, 0.92), rgba(10, 25, 40, 0.95));
      padding: 12px 10px 10px;
      box-shadow: inset 0 0 0 1px rgba(110, 201, 255, 0.08), 0 10px 24px rgba(3, 15, 23, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      animation: stationPulse 3s ease-in-out infinite;
    }

    .station.is-active {
      transform: translateY(-2px);
      box-shadow: 0 0 0 1px rgba(110, 201, 255, 0.12), 0 18px 30px rgba(70, 186, 255, 0.18), inset 0 0 25px rgba(69, 209, 255, 0.08);
    }

    .station::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 28%, transparent 70%, rgba(255,255,255,0.04));
      pointer-events: none;
    }

    .station::after {
      content: "→";
      position: absolute;
      right: -12px;
      top: 46%;
      transform: translateY(-50%);
      color: rgba(130, 209, 255, 0.95);
      font-size: 1.25rem;
      font-weight: 900;
      text-shadow: 0 0 10px rgba(69, 209, 255, 0.7);
      animation: arrowPulse 1.6s ease-in-out infinite;
    }

    .station:last-child::after { content: ""; }

    .station[data-type="source"] { border-color: rgba(69, 209, 255, 0.7); }
    .station[data-type="inspection"] { border-color: rgba(255, 191, 71, 0.85); }
    .station[data-type="repair"] { border-color: rgba(255, 111, 122, 0.8); }
    .station[data-type="output"] { border-color: rgba(74,229,165,0.85); }

    .station-headline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .station-name {
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--text);
      margin-top: 6px;
    }

    .station-metrics {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
    }

    .station-time {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .station-badge {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 4px 7px;
    }

    .queue {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      min-height: 28px;
      margin-top: 10px;
      align-items: center;
    }

    .unit-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      border-radius: 999px;
      padding: 0 7px;
      font-size: 0.62rem;
      font-weight: 800;
      color: #081a29;
      background: linear-gradient(135deg, #b6eaff, #62d0ff);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 4px 14px rgba(53, 147, 255, 0.25);
      animation: chipFloat 2.1s ease-in-out infinite alternate;
    }

    .station[data-type="repair"] .unit-chip { background: linear-gradient(135deg, #ffc4c8, #ff8d96); }
    .station[data-type="inspection"] .unit-chip { background: linear-gradient(135deg, #ffe7b5, #ffcd65); }
    .station[data-type="output"] .unit-chip { background: linear-gradient(135deg, #bff7d6, #6fe6b2); }

    .station[data-type="source"] .unit-chip { background: linear-gradient(135deg, #d8efff, #7ad3ff); }

    .active-unit {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      min-height: 30px;
      align-items: center;
    }

    .plus {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 900;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--muted);
    }

    .unit-layer {
      display: none;
    }

    .unit {
      display: none;
    }

    .unit.failed { display: none; }
    .unit.repair { display: none; }

    .stream {
      display: none;
    }

    .event-feed {
      list-style: none;
      padding: 0;
      margin: 0;
      display: none;
    }

    .event {
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.02);
      padding: 10px 12px;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.4;
    }

    .event strong { color: var(--text); }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(74,229,165,0.12);
      border: 1px solid rgba(74,229,165,0.35);
      color: #bfffe0;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(74,229,165,0.9);
      animation: dotBlink 1.2s ease-in-out infinite alternate;
    }

    @keyframes flowSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes stationPulse {
      0%, 100% { box-shadow: inset 0 0 0 1px rgba(110, 201, 255, 0.08), 0 10px 24px rgba(3, 15, 23, 0.35); }
      50% { box-shadow: inset 0 0 0 1px rgba(110, 201, 255, 0.18), 0 14px 30px rgba(62, 165, 255, 0.18); }
    }

    @keyframes arrowPulse {
      0%, 100% { opacity: 0.6; transform: translateY(-50%) scale(1); }
      50% { opacity: 1; transform: translateY(-50%) scale(1.12); }
    }

    @keyframes chipFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-2px); }
    }

    @keyframes dotBlink {
      0% { opacity: 0.6; box-shadow: 0 0 8px rgba(74,229,165,0.7); }
      100% { opacity: 1; box-shadow: 0 0 16px rgba(74,229,165,1); }
    }

    @media (max-width: 1200px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .board, .stream {
        min-height: 620px;
      }

      .kpis {
        grid-template-columns: repeat(2, minmax(150px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">FlexFlow Digital Twin</p>
        <h1>Production Flow Board</h1>
      </div>
      <div class="topbar-actions">
        <div class="inline-control">
          <label for="inboundRateInput">Inflow</label>
          <input id="inboundRateInput" type="number" min="1" max="120" value="18" />
          <span>u/min</span>
        </div>
        <div class="inline-control">
          <label for="inspectionFailInput">Fail</label>
          <input id="inspectionFailInput" type="number" min="0" max="100" value="18" />
          <span>%</span>
        </div>
        <button id="startBtn" class="primary">Start</button>
        <button id="pauseBtn" class="secondary">Pause</button>
        <button id="resetBtn" class="ghost">Reset</button>
      </div>
    </header>

    <section class="kpis">
      <div class="kpi">
        <span class="label">Inbound</span>
        <span class="value" id="inboundValue">0</span>
      </div>
      <div class="kpi">
        <span class="label">In Process</span>
        <span class="value" id="wipValue">0</span>
      </div>
      <div class="kpi">
        <span class="label">Completed</span>
        <span class="value" id="completedValue">0</span>
      </div>
      <div class="kpi">
        <span class="label">Yield</span>
        <span class="value" id="yieldValue">0%</span>
      </div>
      <div class="kpi">
        <span class="label">Repair Queue</span>
        <span class="value" id="repairValue">0</span>
      </div>
    </section>

    <section class="board-summary">
      <div class="summary-box">
        <span class="summary-label">Input Units</span>
        <span class="summary-value" id="boardInputValue">0</span>
      </div>
      <div class="summary-box">
        <span class="summary-label">Output Units</span>
        <span class="summary-value" id="boardOutputValue">0</span>
      </div>
      <div class="summary-box">
        <span class="summary-label">Yield</span>
        <span class="summary-value" id="boardYieldValue">0%</span>
      </div>
    </section>

    <section class="workspace">
      <main class="panel board">
        <div class="panel-header">
          <h2 class="panel-title">Live Floor</h2>
          <div class="live-pill"><span class="dot"></span> Live</div>
        </div>
        <div class="board-inner">
          <div class="floor">
            <div class="floor-grid"></div>
            <div id="stationRow" class="station-row"></div>
            <div id="unitLayer" class="unit-layer"></div>
          </div>
        </div>
      </main>
    </section>

    <div class="stream" style="display:none;">
      <ul id="eventFeed" class="event-feed"></ul>
    </div>
  </div>

  <script>
    const stationDefinitions = [
      { id: 'receiving', name: 'Receiving', type: 'source', processing: 1.8, next: 'cutting' },
      { id: 'cutting', name: 'Cutting', type: 'process', processing: 4.2, next: 'assembly' },
      { id: 'assembly', name: 'Assembly', type: 'process', processing: 5.5, next: 'inspection' },
      { id: 'inspection', name: 'Inspection', type: 'inspection', processing: 2.6, failRate: 18, next: 'packing', repairTarget: 'repair' },
      { id: 'repair', name: 'Repair', type: 'repair', processing: 6.2, next: 'inspection' },
      { id: 'packing', name: 'Packing', type: 'process', processing: 3.1, next: 'shipping' },
      { id: 'shipping', name: 'Shipping', type: 'output', processing: 1.6 }
    ];

    const state = {
      running: true,
      lastTs: 0,
      units: [],
      currentId: 0,
      inboundRate: 18,
      totalIn: 0,
      totalCompleted: 0,
      failedCount: 0,
      repairQueue: 0,
      spawnAccumulator: 0,
      eventLog: []
    };

    const stationState = {};
    const stationMap = {};
    const unitDisplayMap = new Map();

    function createStationState() {
      stationDefinitions.forEach((station) => {
        stationState[station.id] = { queue: [], active: null, activeElapsed: 0 };
        stationMap[station.id] = station;
      });
    }

    function addEvent(message) {
      const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      state.eventLog.unshift({ time: stamp, text: message });
      if (state.eventLog.length > 12) state.eventLog.pop();
      renderEvents();
    }

    function renderEvents() {
      const feed = document.getElementById('eventFeed');
      feed.innerHTML = state.eventLog.map((event) => `
        <li class="event"><strong>${event.time}</strong> — ${event.text}</li>
      `).join('');
    }

    function syncGlobalInput() {
      document.getElementById('inboundRateInput').value = state.inboundRate;
      document.getElementById('inspectionFailInput').value = stationMap.inspection.failRate || 0;
    }

    function renderStations() {
      const row = document.getElementById('stationRow');
      row.innerHTML = stationDefinitions.map((station) => {
        const stationItem = stationState[station.id];
        const active = stationItem.active ? `
          <div class="active-unit">
            <div class="unit-chip" style="background: ${getUnitColor(stationItem.active)};">${stationItem.active.label}</div>
          </div>
        ` : '<div class="active-unit"></div>';

        const queueUnits = stationItem.queue.slice(0, 4).map((unit) => `<div class="unit-chip" style="background: ${getUnitColor(unit)};">${unit.label}</div>`).join('');

        const isActive = Boolean(stationItem.active);
        return `
          <div id="station-${station.id}" class="station ${isActive ? 'is-active' : ''}" data-type="${station.type}">
            <div>
              <div class="station-headline">
                <span>${station.type}</span>
                <span class="station-badge">${stationItem.queue.length + (stationItem.active ? 1 : 0)}</span>
              </div>
              <div class="station-name">${station.name}</div>
              <div class="station-metrics">
                <span class="station-time">${station.processing}s</span>
                <span class="station-badge">${station.failRate ? `${station.failRate}% fail` : 'stable'}</span>
              </div>
            </div>
            <div class="queue">${queueUnits || '<span style="color: var(--muted); opacity: .7; font-size: .72rem;">Queue clear</span>'}</div>
            ${active}
            <div class="plus">+</div>
          </div>
        `;
      }).join('');
    }

    function getUnitColor(unit) {
      if (unit.status === 'failed') return 'linear-gradient(135deg, #ffc4c8, #ff8d96)';
      if (unit.status === 'repaired') return 'linear-gradient(135deg, #ffe7b5, #ffcd65)';
      return 'linear-gradient(135deg, #b6eaff, #62d0ff)';
    }

    function createUnit() {
      const unit = {
        id: `U-${++state.currentId}`,
        label: state.currentId,
        status: 'active',
        routeCount: 0,
        currentStation: 'receiving',
        movingTo: null,
        fromStation: null,
        progress: 0,
        processElapsed: 0,
        failed: false,
        repaired: false,
        initialColor: `hsl(${(state.currentId * 27) % 360} 85% 68%)`
      };
      stationState.receiving.queue.push(unit);
      state.totalIn += 1;
      addEvent(`Unit ${unit.id} entered receiving queue.`);
      return unit;
    }

    function updateKpis() {
      const inProcess = Object.values(stationState).reduce((sum, st) => sum + st.queue.length + (st.active ? 1 : 0), 0);
      const completed = state.totalCompleted;
      const yield = state.totalIn ? ((completed / state.totalIn) * 100).toFixed(1) : 0;

      document.getElementById('inboundValue').textContent = state.totalIn;
      document.getElementById('wipValue').textContent = inProcess;
      document.getElementById('completedValue').textContent = completed;
      document.getElementById('yieldValue').textContent = `${yield}%`;
      document.getElementById('repairValue').textContent = state.repairQueue;

      document.getElementById('boardInputValue').textContent = state.totalIn;
      document.getElementById('boardOutputValue').textContent = completed;
      document.getElementById('boardYieldValue').textContent = `${yield}%`;
    }

    function startProcessingIfAvailable(station) {
      const stationItem = stationState[station.id];
      if (stationItem.active || stationItem.queue.length === 0) return;

      const unit = stationItem.queue.shift();
      stationItem.active = unit;
      unit.currentStation = station.id;
      unit.processElapsed = 0;
      unit.status = station.type === 'inspection' ? 'inspection' : 'active';
      if (station.type === 'inspection') {
        unit.failed = false;
        unit.repaired = false;
      }
    }

    function finishStation(stationId) {
      const station = stationMap[stationId];
      const stationItem = stationState[stationId];
      const unit = stationItem.active;
      if (!unit) return;

      stationItem.active = null;
      unit.processElapsed = 0;

      if (station.type === 'inspection') {
        const failRoll = Math.random() * 100;
        if (failRoll < (station.failRate || 0)) {
          unit.failed = true;
          unit.status = 'failed';
          state.failedCount += 1;
          stationState.repair.queue.push(unit);
          state.repairQueue = stationState.repair.queue.length;
          addEvent(`${unit.id} failed inspection and was routed to repair.`);
          return;
        }
        unit.status = 'passed';
        addEvent(`${unit.id} passed ${station.name}.`);
      } else if (station.type === 'repair') {
        unit.status = 'repaired';
        unit.repaired = true;
        state.repairQueue = Math.max(0, stationState.repair.queue.length - 1);
      } else if (station.type === 'output') {
        state.totalCompleted += 1;
        unit.status = 'complete';
        addEvent(`${unit.id} completed shipping.`);
        state.units = state.units.filter((item) => item.id !== unit.id);
        updateKpis();
        return;
      }

      const nextStation = station.type === 'repair' ? 'inspection' : (station.next || null);
      if (nextStation) {
        const target = stationMap[nextStation];
        if (target && target.type === 'inspection') {
          unit.currentStation = nextStation;
          stationState[nextStation].queue.push(unit);
          addEvent(`${unit.id} moved to ${target.name}.`);
        } else {
          unit.currentStation = nextStation;
          stationState[nextStation].queue.push(unit);
        }
      }

      if (station.type === 'inspection' && unit.failed) {
        state.repairQueue = stationState.repair.queue.length;
      }

      updateKpis();
    }

    function advanceUnitFlow() {
      Object.values(stationMap).forEach((station) => {
        const stationItem = stationState[station.id];

        if (stationItem.active) {
          stationItem.active.processElapsed += 0.25;
          if (stationItem.active.processElapsed >= station.processing) {
            finishStation(station.id);
          }
        }

        if (!stationItem.active && stationItem.queue.length > 0) {
          startProcessingIfAvailable(station);
        }
      });

      Object.keys(stationState).forEach((stationId) => {
        const stationItem = stationState[stationId];
        if (stationItem.active && stationItem.active.currentStation !== stationId) {
          stationItem.active.currentStation = stationId;
        }
      });
    }

    function renderUnits() {
      // Unit badges remain inside station cards to avoid floating overlays.
    }

    function tick() {
      if (!state.running) return;
      state.spawnAccumulator += 0.25;
      const spawnInterval = 60 / state.inboundRate;
      if (state.spawnAccumulator >= spawnInterval) {
        state.spawnAccumulator = 0;
        const newUnit = createUnit();
        state.units.push(newUnit);
      }

      advanceUnitFlow();
      renderStations();
      renderUnits();
      updateKpis();
    }

    function bindEvents() {
      document.getElementById('startBtn').addEventListener('click', () => {
        state.running = true;
        addEvent('Production cycle resumed.');
      });

      document.getElementById('pauseBtn').addEventListener('click', () => {
        state.running = false;
        addEvent('Production cycle paused.');
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        state.running = false;
        state.units = [];
        state.totalIn = 0;
        state.totalCompleted = 0;
        state.failedCount = 0;
        state.repairQueue = 0;
        state.spawnAccumulator = 0;
        state.eventLog = [];
        Object.keys(stationState).forEach((id) => {
          stationState[id].queue = [];
          stationState[id].active = null;
          stationState[id].activeElapsed = 0;
        });
        addEvent('Factory floor reset complete.');
        updateKpis();
        renderStations();
        renderUnits();
      });

      document.getElementById('inboundRateInput').addEventListener('input', (event) => {
        const value = Number(event.target.value) || 18;
        state.inboundRate = Math.max(1, Math.min(120, value));
        addEvent(`Inbound rate updated to ${state.inboundRate} units/min.`);
      });

      document.getElementById('inspectionFailInput').addEventListener('input', (event) => {
        const value = Number(event.target.value) || 0;
        const failRate = Math.max(0, Math.min(100, value));
        stationMap.inspection.failRate = failRate;
        addEvent(`Inspection failure rate updated to ${failRate}%.`);
        renderStations();
      });
    }

    function init() {
      createStationState();
      renderStations();
      renderEvents();
      syncGlobalInput();
      bindEvents();
      state.units.push(createUnit());
      stationState.receiving.queue.push(createUnit());
      renderStations();
      renderUnits();
      updateKpis();
      setInterval(tick, 250);
    }

    init();
  </script>
</body>
</html>
